<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="stylesheet.css">
        <script src="scripts.js" defer></script>
    </head>
    <body style="display: none;">
        <div class="formAdmin">
            <h3>Crear admin</h3>
            <form id="crearAdminForm">
                <input type="email" name="email" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Crear admin</button>
            </form>
            <p id="mensajeAdmin2"></p>
        </div>
        
        <div class="formAdmin">
            <h3>Crear profesor</h3>
            <form id="crearProfesorForm">
                <input type="email" name="email" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Crear profesor</button>
            </form>
            <p id="mensajeAdmin"></p>
        </div>

        <h2>Cambiar contraseña de usuario</h2>
        <form id="cambiarPasswordForm">
            <input type="email" name="email" placeholder="Correo del usuario" required>
            <input type="password" name="password" placeholder="Nueva contraseña" required>
            <button type="submit">Cambiar contraseña</button>
        </form>
        <p id="mensajeCambio"></p>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </body>
</html>
